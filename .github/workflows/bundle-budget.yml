name: Bundle budget

on:
  pull_request:

jobs:
  bundle-budget:
    runs-on: ubuntu-latest

    env:
      # prisma generate runs on postinstall and reads DATABASE_URL from
      # prisma.config.ts. The analyzer never connects to a database.
      DATABASE_URL: postgresql://dev:dev@localhost:5999/dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keep CI on the exact npm that generated the lockfile, matching test.yml.
      - name: Pin npm
        run: npm install -g npm@12.0.2

      - run: npm ci

      - name: Analyze Turbopack bundle
        run: npm run bundle:analyze

      - name: Check bundle budget
        id: budget
        run: npm run --silent bundle:budget > bundle-budget-report.md
        continue-on-error: true

      - name: Publish bundle budget report
        if: always()
        run: |
          if [ -f bundle-budget-report.md ]; then
            cat bundle-budget-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-budget-report
          path: bundle-budget-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail when over budget
        if: steps.budget.outcome == 'failure'
        run: exit 1
