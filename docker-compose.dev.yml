# Development database.
#
# Kept in a separate compose file so the test database (`docker-compose.yml`)
# and its reset script never touch development data. Run it through the
# `dev:db:*` npm scripts, which pin a separate Compose project name.
#
# PostgreSQL 18 matches production, so a production dump can be restored here.
services:
  db:
    image: postgres:18
    container_name: pictures-writers-dev-db
    # The stock `max_connections` is 100, which `next build` exhausts: it
    # prerenders with one worker per CPU and each worker keeps its own Prisma
    # pool. The build then dies with P2037 "too many database connections"
    # before it finishes generating static pages.
    command: ["postgres", "-c", "max_connections=200"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pictures_writers_dev
    # Bind loopback only, and explicitly on IPv4. A bare "5434:5432" also
    # publishes [::]:5434, and Docker Desktop on Windows can accept those IPv6
    # connections without ever forwarding them. Node resolves `localhost` to
    # ::1 first and then hangs on a half-open connection (no Postgres backend
    # ever appears), which stalls `next build` and `npm run dev` indefinitely.
    # With no IPv6 listener the connection is refused immediately and Node
    # falls back to 127.0.0.1. Keeping it on loopback also stops the dev
    # database from being reachable from the local network.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pictures-writers-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pictures_writers_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pictures-writers-dev-db:
    name: pictures-writers-dev-db
