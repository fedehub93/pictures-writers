services:
  db:
    image: postgres:16
    container_name: pictures-writers-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pictures_writers_test
    ports:
      - "5433:5432"
    volumes:
      - pictures-writers-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pictures_writers_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pictures-writers-test-db:
