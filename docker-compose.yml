services:
  db:
    image: postgres:16
    container_name: pictures-writers-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pictures_writers_test
    # Loopback and IPv4 only, for the same reason as the development database
    # (see docker-compose.dev.yml): an [::]:5433 listener can black-hole
    # connections that Node opens against `localhost`.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pictures-writers-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pictures_writers_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pictures-writers-test-db:
